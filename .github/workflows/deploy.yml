name: CI / Deploy

# ─────────────────────────────────────────────────────────────────────────────
#  Triggers
#    push dev   → build + lint + deploy to STAGING server
#    push main  → build + lint + deploy to PRODUCTION server
#    PR → main  → build + lint only (quality gate, no deploy)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── 1. Build & Lint ──────────────────────────────────────────────────────────
  # Always runs. Blocks deploy jobs if lint or build fails.
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Share the compiled dist/ with deploy jobs — avoids rebuilding
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── 2. Deploy → Staging  (dev branch pushes only) ───────────────────────────
  #
  # GitHub Secrets required:
  #   SSH_PRIVATE_KEY       Private key whose public key is in ~/.ssh/authorized_keys on the server
  #   STAGING_SSH_HOST      Hostname or IP  (e.g. staging.acenzos.com or 123.45.67.89)
  #   STAGING_SSH_PORT      22 for VPS · 2222 for cPanel SSH
  #   STAGING_SSH_USER      SSH login user  (VPS: root/deploy · cPanel: cpanel-username)
  #   STAGING_DEPLOY_PATH   Absolute path on server
  #                         cPanel → /home/USERNAME/staging.acenzos.com/public_html
  #                         VPS    → /var/www/staging.acenzos.com/public_html
  deploy-staging:
    name: Deploy → Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    environment:
      name: staging

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: |
          ssh-keyscan -p ${{ secrets.STAGING_SSH_PORT }} \
            ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync dist → staging server
        run: |
          rsync -avzr --delete \
            -e "ssh -p ${{ secrets.STAGING_SSH_PORT }}" \
            dist/ \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:${{ secrets.STAGING_DEPLOY_PATH }}

      - name: Done
        run: echo "Staging deploy complete — ${{ github.sha }}"

  # ── 3. Deploy → Production  (main branch pushes only) ───────────────────────
  #
  # GitHub Secrets required:
  #   SSH_PRIVATE_KEY       Same key as above (or a separate prod-only key)
  #   PROD_SSH_HOST         Hostname or IP  (e.g. acenzos.com or 98.76.54.32)
  #   PROD_SSH_PORT         22 for VPS · 2222 for cPanel SSH
  #   PROD_SSH_USER         SSH login user
  #   PROD_DEPLOY_PATH      Absolute path on server
  #                         cPanel → /home/USERNAME/acenzos.com/public_html
  #                         VPS    → /var/www/acenzos.com/public_html
  #
  # Tip: add yourself as a Required Reviewer in
  #   GitHub → Settings → Environments → production → Required reviewers
  # to get a manual approval step before every production deploy.
  deploy-production:
    name: Deploy → Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust server host key
        run: |
          ssh-keyscan -p ${{ secrets.PROD_SSH_PORT }} \
            ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync dist → production server
        run: |
          rsync -avzr --delete \
            -e "ssh -p ${{ secrets.PROD_SSH_PORT }}" \
            dist/ \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}

      - name: Done
        run: echo "Production deploy complete — ${{ github.sha }}"
